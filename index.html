<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單字果園</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5cc5d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="單字果園">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--surface:#fff;--ink:#1d3640;--muted:#62767f;--line:#d8e2e6;--accent:#1fa7b8;--accent-ink:#fff;--bad:#c4452f;--field:#9bd16f;--qbg:#f3f3f3;--soil2:#ec9540;--done:#7fc8b8;--nav:#0c3b57;--good:#6bd3de;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#1a2c34;--ink:#e8f1f4;--muted:#98adb6;--line:#2e4650;--bad:#ff8a76;--field:#4f7a3a;--qbg:#10191d;--good:#1f7f8c;color-scheme:dark}}
:root[data-theme="dark"]{--surface:#1a2c34;--ink:#e8f1f4;--muted:#98adb6;--line:#2e4650;--bad:#ff8a76;--field:#4f7a3a;--qbg:#10191d;--good:#1f7f8c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.5 "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(#5cc5d2 0,#f7d2a8 240px,var(--field) 241px);min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#5cc5d2;z-index:5}
.wrap{max-width:560px;margin:0 auto}
.scene{position:relative;height:190px;overflow:hidden}
.scene svg{position:absolute;inset:auto 0 0;width:100%;height:140px}
.sun{position:absolute;left:38%;top:30px;width:52px;height:52px;border-radius:50%;background:#fff6d6;box-shadow:0 0 40px 18px rgba(255,246,214,.6)}
.pills{position:absolute;right:12px;top:12px;display:grid;gap:8px;justify-items:end}
.pill{background:rgba(255,255,255,.85);color:#3a4a50;border-radius:99px;padding:3px 16px;font-weight:700;font-size:1.1rem}
.sign{position:absolute;left:14px;bottom:10px;z-index:2;background:#a9674f;color:#fff;font-weight:700;padding:6px 16px;border-radius:6px;border:3px solid #8d503c}
.soil{background:#f3a24a;padding:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 0 12px}
@media(min-width:600px){.soil{border-radius:14px}}
.tile{aspect-ratio:1/1.1;border:0;border-radius:10px;background:#f4a64f;box-shadow:0 4px 0 var(--soil2);color:#5a3410;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px;line-height:1.25}
.tile .em{font-size:1.5rem}.tile .tw{font-size:.68rem;font-weight:700}.tile .tn{font-size:.62rem;opacity:.8}
.tile.done{background:var(--done);box-shadow:0 4px 0 #5fa898;color:#12413a}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:10px;padding:0 12px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:12px 18px;border-radius:99px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.f{flex:1}
.panel{background:var(--surface);border-radius:14px;margin:12px;padding:16px;text-align:center;color:var(--muted)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
textarea{min-height:48px;resize:vertical}
.dots{display:flex;align-items:center;justify-content:center;margin:10px 0}
.dots i{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:.8rem;color:var(--muted);flex:none}
.dots i+i{margin-left:6px}.dots i.on{background:var(--accent);color:#fff}
.dots.sm i{width:13px;height:13px;font-size:0}.dots.sm i+i{margin-left:3px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h2{text-align:center;font-weight:500;margin:0 0 6px;font-size:1.3rem}
.mean{text-align:center;color:var(--muted);margin:4px 0}
.hint{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:10px;margin-top:12px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wl{max-height:34vh;overflow:auto;margin-top:6px}
li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:6px;align-items:center}
#vList li{border:0}
li .t{flex:1;min-width:0}
li b{font-family:Georgia,serif}
.ic{border:0;background:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);display:flex;justify-content:center;gap:28px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
nav button{border:0;background:none;color:#cfe3ee;font:inherit;font-size:.85rem;display:grid;justify-items:center;gap:2px;cursor:pointer;min-width:72px}
nav button i{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-size:1.3rem}
nav button[aria-selected="true"]{color:#fff;font-weight:700}
nav button[aria-selected="true"] i{box-shadow:0 0 0 3px #7fdbe8}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16303a;color:#fff;padding:8px 18px;border-radius:99px;z-index:60;font-weight:700;max-width:90vw;text-align:center}
/* quiz */
#quiz{position:fixed;inset:0;z-index:40;background:var(--qbg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
.qh{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center;padding-top:8px}
.qh button{border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
.qbar{height:8px;background:var(--line);border-radius:9px;margin:6px 0 12px;overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:#9acd4a;transition:width .3s}
.qcard{flex:1;background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;min-height:0;overflow:auto;position:relative}
.qtop{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:120px}
.qw{font:600 1.7rem/1.3 Georgia,serif;color:var(--accent);display:flex;gap:10px;align-items:center;text-align:center;overflow-wrap:anywhere}
.spk{border:0;background:#fbd04a;color:#fff;width:38px;height:38px;border-radius:50%;font-size:1rem;cursor:pointer;flex:none}
.spk.big{width:76px;height:76px;font-size:1.8rem}
.abc{display:flex;gap:22px}.abc div{display:grid;justify-items:center;gap:2px;color:var(--muted)}
.tag{position:absolute;left:0;top:0;background:#9acd4a;color:#fff;font-size:.8rem;padding:2px 12px;border-radius:14px 0 14px 0}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:13px;border-radius:10px;cursor:pointer;min-height:48px}
.opt .mk{position:absolute;left:12px;width:24px;font-weight:700}
.opt.good{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.opt.unsure{border-color:#f0c64a;color:#c9961a}
.nx{margin-top:12px;border:1px solid var(--good);background:#dff6f9;color:#128a98;font:inherit;font-weight:700;padding:13px;border-radius:10px;cursor:pointer;width:100%;text-align:center}
@media (prefers-color-scheme:dark){.nx{background:#17434a;color:#8fe3ee}}
.qmas{height:78px;display:flex;justify-content:center;align-items:flex-end;font-size:3rem;line-height:1;background:linear-gradient(transparent 55%,#7cc9d6 55%);margin:0 -14px;padding-bottom:6px}
.win{color:#7bb52c;font-size:1.3rem;font-weight:700;text-align:center}
#story{position:fixed;inset:0;z-index:50;background:#1b1713;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sx{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:2;border:0;background:rgba(0,0,0,.4);color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:20px;transition:background .4s;text-align:center;overflow:auto}
.who{font-size:7rem;line-height:1}.nm{opacity:.85;font-size:.95rem}
.sub{font-size:1.6rem;font-weight:800;line-height:1.35;text-shadow:0 2px 0 #000,0 0 6px #000;margin-top:18px;max-width:92%}
.sub em{font-style:normal;color:#ffd83a}
.sdots{display:flex;gap:6px;justify-content:center;padding:0 0 14px}.sdots i{width:22px;height:4px;border-radius:3px;background:rgba(255,255,255,.3)}.sdots i.on{background:#fff}
.eword{font:800 2.8rem/1.1 Georgia,serif;color:#ffd83a;text-shadow:0 2px 0 #000;overflow-wrap:anywhere}
.eipa{font-size:1.2rem}
.emean{background:#fff;color:#222;border-radius:99px;padding:6px 26px;font-weight:800;font-size:1.2rem}
.ebtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.ebtns button{border:0;border-radius:99px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:rgba(255,255,255,.18);color:#fff}
.ebtns .p{background:#ffd83a;color:#222}
.vp{background:rgba(0,0,0,.45);border-radius:10px;padding:10px;font-size:.8rem;text-align:left;max-height:30vh;overflow:auto;width:100%;white-space:pre-wrap;user-select:text}
.gen{padding:10px 30px;font-size:1.1rem}
[data-story]{display:none!important}
.io{padding:14px 12px 0;flex-wrap:wrap}
.io .btn{padding:9px 14px;font-size:.9rem}
.vsticky{position:sticky;top:0;z-index:4;background:var(--surface)}
.vp16{aspect-ratio:16/9;background:#000}.vp16 iframe{width:100%;height:100%;display:block}
.autol{display:block;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.autol input{width:auto;margin:0 6px 0 0;padding:0}
.vset{margin:12px;background:var(--surface);border-radius:14px;padding:10px 14px}
.vset summary{cursor:pointer;font-weight:700}
.cue{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.cue.cur{background:#fff3b0;color:#222}
.sk{border:0;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:28px;height:28px;flex:none;font-size:.7rem;cursor:pointer;margin-top:3px}
.ct{line-height:1.9;font-size:1.05rem}
.wd{cursor:pointer;border-radius:4px;padding:0 1px}
.wd:active{background:#ffe58a;color:#222}
.kw{color:#2c8a3a;font-weight:700;text-decoration:underline}
@media (prefers-color-scheme:dark){.kw{color:#6fdc80}.cue.cur .kw{color:#2c8a3a}}
.nowbar{padding:8px 12px;font-size:1.15rem;line-height:1.8;max-height:26vh;overflow:auto;background:var(--surface);border-top:1px solid var(--line)}
.nowbar.hintx{color:var(--muted);font-size:.9rem;line-height:1.5}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div id="vField">
<div class="scene">
<div class="sun"></div>
<svg viewBox="0 0 400 150" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,150 0,95 70,50 130,95 200,20 290,100 340,60 400,100 400,150" fill="#ef8f78"/><polygon points="0,150 0,125 90,85 170,125 260,90 330,125 400,100 400,150" fill="#2b9a9c"/><rect y="138" width="400" height="12" fill="#a6d673"/></svg>
<div class="pills"><div class="pill" id="pDone">🍎 0</div><div class="pill" id="pCnt">💧 0</div></div>
<div class="sign">我的果園</div>
</div>
<div class="soil" id="soil"></div>
<div class="panel" id="emptyF" hidden>還沒有地塊。每 10 個單字會種成一塊地，先新增單字吧。</div>
<div class="bar"><button class="btn f" id="addOpen">＋ 新增單字</button></div>
</div>
<div id="vList" hidden>
<div class="bar io"><button class="btn ghost" data-io="exp">匯出備份</button><button class="btn ghost" data-io="imp">匯入備份</button><button class="btn ghost" data-io="csv">匯入單字表</button><button class="btn ghost" data-io="expcsv">匯出 CSV</button><button class="btn ghost" data-io="clear" style="color:var(--bad);border-color:var(--bad)">清空全部單字</button></div>
<input type="file" id="fileIn" hidden>
<div style="padding:14px 12px 8px"><input id="q" placeholder="搜尋單字或意思" style="background:var(--surface)"></div>
<ul id="list" style="padding:0 12px"></ul>
<div class="panel" id="lEmpty" hidden>還沒有單字。</div>
</div>
<div id="vVideo" hidden>
<details class="vset" id="vset" open><summary>影片與字幕設定</summary>
<div style="margin-top:10px">
<input id="vurl" placeholder="貼上 YouTube 連結" inputmode="url" autocapitalize="none">
<button class="btn" data-v="load" style="width:100%;margin-bottom:10px">載入影片</button>
<textarea id="sub" placeholder="貼上字幕文字（YouTube「顯示轉錄稿」複製的內容，或 .srt / .vtt 的內容）" style="min-height:110px"></textarea>
<div class="row" style="margin-top:0"><button class="btn f" data-v="sub">套用字幕</button><button class="btn ghost" data-v="file">選擇字幕檔</button></div>
<p class="hint">點字幕裡不熟的英文單字，就能查意思並加入果園。</p>
</div></details>
<div class="vsticky" id="vbox" hidden><div class="vp16"><div id="yt"></div></div><div class="nowbar hintx" id="nowbar" data-i="-1">字幕會顯示在這裡，點單字即可加入</div><label class="autol"><input type="checkbox" id="auto" checked>自動捲動到目前這句</label></div>
<div id="tr"><div class="panel">載入影片並貼上字幕後，字幕會顯示在這裡。</div></div>
</div>
<input type="file" id="fileSub" accept=".srt,.vtt,.txt,text/plain" hidden>
</div>
<nav>
<button id="nF" aria-selected="true"><i>🌳</i>果園</button>
<button id="nL" aria-selected="false"><i>📚</i>字庫</button>
<button id="nV" aria-selected="false"><i>🎬</i>影片</button>
</nav>
<div id="modal"></div>
<div id="quiz" hidden>
<div class="qh"><button id="qx" aria-label="離開練習">✕</button><div id="qt"></div><span></span></div>
<div class="qbar"><i id="qfill"></i></div>
<div class="qcard" id="qcard"></div>
<div class="qmas"><span id="mas">🐥</span></div>
</div>

<div id="story" hidden></div>
<script>
(function(){
var words=[],prog={},S=null,KEY="vocab-v3",ST=null,TM=null;
var EM=["🌰","🌱","🌿","🌿","🌾","🌳","🌸","🍎"],MAX=7,TYPES=["en2zh","au2zh","zh2en","zh2au"];
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function load(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);words=d.words||[];prog=d.prog||{};return}
var o=localStorage.getItem("vocab-v2")||localStorage.getItem("vocab-v1");
if(o){var a=JSON.parse(o);a.sort(function(x,y){return((x.o||0)*10+(x.s||0))-((y.o||0)*10+(y.s||0))});
a.forEach(function(x,i){words.push({id:x.id,w:x.w,m:x.m,e:x.e,g:Math.floor(i/10)})})}}catch(e){words=[];prog={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({words:words,prog:prog}))}catch(e){}}
function inG(g){return words.filter(function(x){return x.g===g})}
function maxG(){var m=-1;words.forEach(function(x){if(x.g>m)m=x.g});return m}
var warned=false;
function speak(t,l){l=l||"en-US";
if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){if(!warned){warned=true;toast("這個瀏覽器不支援發音，請改用 Chrome 或 Safari 開啟")}return}
try{var u=new SpeechSynthesisUtterance(t);u.lang=l;var vs=speechSynthesis.getVoices()||[];var v=vs.filter(function(x){return x.lang.toLowerCase().replace("_","-").indexOf(l.slice(0,2).toLowerCase())===0})[0];if(v)u.voice=v;
if(speechSynthesis.speaking)speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1600)}
function dots(p,sm){var h='<div class="dots'+(sm?' sm':'')+'">';for(var i=1;i<=MAX;i++)h+='<i class="'+(i<=p?'on':'')+'">'+(i===MAX?'✓':'')+'</i>';return h+'</div>'}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function byId(id){return words.filter(function(x){return String(x.id)===String(id)})[0]}

function render(){
var mg=maxG(),h="",d=0,c=0;
for(var g=0;g<=mg;g++){var p=prog[g]||0;c+=p;if(p>=MAX)d++;
h+='<button class="tile'+(p>=MAX?' done':'')+'" data-g="'+g+'"><span class="em">'+EM[p]+'</span><span class="tw">地塊'+(g+1)+'</span><span class="tn">'+inG(g).length+'/10</span></button>'}
$("soil").innerHTML=h;$("soil").hidden=mg<0;$("emptyF").hidden=mg>=0;
$("pDone").textContent="🍎 "+d;$("pCnt").textContent="💧 "+c;
}
function renderList(){
var q=$("q").value.trim().toLowerCase();
var a=words.filter(function(x){return!q||x.w.toLowerCase().indexOf(q)>-1||x.m.indexOf(q)>-1});
$("list").innerHTML=a.map(function(x){return'<li><div class="t"><b>'+esc(x.w)+'</b> <span class="hint">地塊'+(x.g+1)+'</span><div>'+esc(x.m)+'</div></div><button class="ic" data-say="'+x.id+'" aria-label="發音">🔊</button><button class="ic" data-story="'+x.id+'" aria-label="諧音梗短劇">🎬</button></li>'}).join("");
$("lEmpty").hidden=words.length>0;
}
function sheet(html){$("modal").innerHTML='<div class="sheetbg" id="bg"><div class="sheet" role="dialog">'+html+'</div></div>'}
function closeSheet(){$("modal").innerHTML="";render();renderList()}

function openAdd(){
sheet('<h2>新增單字</h2><input id="aw" placeholder="英文單字" autocapitalize="none" autocomplete="off"><input id="am" placeholder="中文意思"><textarea id="ae" placeholder="例句（選填）"></textarea><div class="row"><button class="btn ghost f" data-x="1">完成</button><button class="btn f" data-add="1">加入</button></div><p class="hint" id="amsg" role="status">每 10 個單字會自動種成一塊地。</p>');
$("aw").focus();
}
function addWord(){
var w=$("aw").value.trim(),m=$("am").value.trim(),e=$("ae").value.trim();
if(!w||!m){$("amsg").textContent="請輸入單字和中文意思";return}
if(words.some(function(x){return x.w.toLowerCase()===w.toLowerCase()})){$("amsg").textContent="這個單字已經在單字庫了";return}
var g=0;while(inG(g).length>=10)g++;
words.push({id:Date.now()+Math.floor(Math.random()*999),w:w,m:m,e:e,g:g});save();
$("aw").value=$("am").value=$("ae").value="";$("aw").focus();
$("amsg").textContent="已加入「"+w+"」→ 地塊 "+(g+1)+"（"+inG(g).length+"/10）";render();
}
function openPlot(g){
var ws=inG(g),p=prog[g]||0;
sheet('<h2>［ 地塊 '+(g+1)+' ］</h2>'+dots(p)+'<p class="mean">'+ws.length+'/10 個單字</p><ul class="wl">'+ws.map(function(x){return'<li><div class="t"><b>'+esc(x.w)+'</b> '+esc(x.m)+'</div><button class="ic" data-say="'+x.id+'" aria-label="發音">🔊</button><button class="ic" data-story="'+x.id+'" aria-label="諧音梗短劇">🎬</button><button class="ic" data-del="'+x.id+'" data-g="'+g+'" aria-label="刪除">🗑</button></li>'}).join("")+'</ul>'

function parseCsv(t){

for(var i=0;i<t.length;i++){var c=t[i];

else if(c==='"')q=true;

else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}

function ts(h,m,s,ms){return(h?parseInt(h,10):0)*3600+(+m)*60+(+s)+parseFloat("0."+(ms||"0"))}
function parseSub(t){
t=t.replace(/^\uFEFF/,"").replace(/\r/g,"");var out=[],i;
var re=/(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[.,](\d{1,3})\s*-->\s*(?:(\d{1,2}):)?(\d{1,2}):(\d{2})[.,](\d{1,3})/;
t.split(/\n\s*\n/).forEach(function(b){var ls=b.split("\n"),k=-1,m=null;
for(i=0;i<ls.length;i++){m=ls[i].match(re);if(m){k=i;break}}
if(k<0)return;
var txt=ls.slice(k+1).join(" ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
if(txt)out.push({s:ts(m[1],m[2],m[3],m[4]),e:ts(m[5],m[6],m[7],m[8]),t:txt})});
if(out.length)return out;
var only=/^(?:(\d{1,2}):)?(\d{1,2}):(\d{2})$/,inl=/^(?:(\d{1,2}):)?(\d{1,2}):(\d{2})\s+(\S.*)$/,cur=null;
t.split("\n").forEach(function(l){l=l.trim();if(!l)return;
var m=l.match(only),m2=l.match(inl);
if(m){cur={s:ts(m[1],m[2],m[3],"0"),e:-1,t:""};out.push(cur)}
else if(m2){cur={s:ts(m2[1],m2[2],m2[3],"0"),e:-1,t:m2[4]};out.push(cur)}
else if(cur)cur.t+=(cur.t?" ":"")+l});
out=out.filter(function(c){return c.t});
if(out.length){for(i=0;i<out.length-1;i++)out[i].e=out[i+1].s;out[out.length-1].e=out[out.length-1].s+5;return out}
t.split("\n").forEach(function(l){l=l.trim();if(l)out.push({s:-1,e:-1,t:l})});
return out;
}

}
function openWord(el){
var w=el.dataset.w,i=+el.closest("[data-i]").dataset.i,sent=cues[i].t;VW={w:w,sent:sent};
try{YTP.pauseVideo()}catch(e){}
var known=words.some(function(x){return x.w.toLowerCase()===w});
sheet('<h2>'+esc(w)+'</h2><p class="mean" style="font-style:italic">'+esc(sent)+'</p><input id="vm" placeholder="中文意思（可修改）"><p class="hint" id="vtr">翻譯中…</p><div class="row"><button class="btn ghost" data-vsay="1" aria-label="發音">🔊</button><button class="btn f" data-vadd="1">'+(known?"已在果園":"加入單字果園")+'</button></div><div class="row"><button class="btn ghost f" data-vclose="1">繼續播放</button></div>');
speak(w);
tr(w).then(function(m){if(VW&&VW.w===w&&$("vm")&&!$("vm").value)$("vm").value=m});
tr(sent).then(function(m){if(VW&&VW.w===w&&$("vtr"))$("vtr").textContent=m?"整句："+m:"（翻譯失敗，可自己輸入意思）"});
}
function vAdd(){
var m=$("vm").value.trim();if(!m){toast("請輸入中文意思");return}
if(words.some(function(x){return x.w.toLowerCase()===VW.w})){toast("這個單字已經在單字庫了");return}
var g=0;while(inG(g).length>=10)g++;
words.push({id:Date.now(),w:VW.w,m:m,e:VW.sent,g:g});save();
document.querySelectorAll('.wd[data-w="'+VW.w+'"]').forEach(function(x){x.classList.add("kw")});
toast("已加入「"+VW.w+"」→ 地塊 "+(g+1));vResume();
}
function vResume(){closeSheet();try{YTP.playVideo()}catch(e){}}

function tab(n){
$("vField").hidden=n!=="f";$("vList").hidden=n!=="l";$("vVideo").hidden=n!=="v";
$("nF").setAttribute("aria-selected",n==="f");$("nL").setAttribute("aria-selected",n==="l");$("nV").setAttribute("aria-selected",n==="v");
if(n!=="v"){try{YTP.pauseVideo()}catch(e){}}
if(n==="l")renderList();else if(n==="f")render();
if(n==="v"&&!vInit){vInit=true;if(vid)loadVideo(vid)}
}
$("nF").onclick=function(){tab("f")};$("nL").onclick=function(){tab("l")};$("nV").onclick=function(){tab("v")};
$("addOpen").onclick=openAdd;$("q").addEventListener("input",renderList);
$("qx").onclick=function(){if(confirm("離開練習？這次的進度不會計算。"))quitQuiz()};
document.addEventListener("click",function(e){
if(e.target.id==="bg"){closeSheet();return}
var sg=e.target.closest("[data-sn]");if(sg&&ST){clearTimeout(TM);ST.i++;scene();return}
var wd=e.target.closest(".wd");if(wd){openWord(wd);return}
var b=e.target.closest("button");if(!b)return;var d=b.dataset;
if(d.g&&!d.del&&b.classList.contains("tile"))openPlot(+d.g);
else if(d.x)closeSheet();
else if(d.add)addWord();
else if(d.addo)openAdd();
else if(d.say){var x=byId(d.say);if(x)speak(x.w)}
else if(d.del){var y=byId(d.del);if(y&&confirm("刪除「"+y.w+"」？")){words=words.filter(function(z){return z!==y});save();render();openPlot(+d.g)}}
else if(d.prac)startQuiz(+d.prac);
else if(d.reset){prog[d.reset]=0;save();closeSheet();toast("重新種下了")}
else if(d.sp)speak(S.queue[0].w.w);
else if(d.spo)speak(S.queue[0].opts[+d.spo].w);
else if(d.o!==undefined&&S)pick(+d.o);
else if(d.nx)next();
else if(d.qclose)quitQuiz();else if(d.story)openStory(d.story);else if(d.sx)closeStory();else if(d.ssay)speak(ST.w.w);else if(d.sreplay)playStory();else if(d.regen)genStory(true);else if(d.vp)copyVp();else if(d.io)ioAct(d.io);else if(d.v)vAct(d.v);else if(d.vadd)vAdd();else if(d.vclose)vResume();else if(d.vsay)speak(VW.w);else if(d.seek!==undefined)seek(+d.seek);
});
load();render();
try{var sv=JSON.parse(localStorage.getItem("vocab-video")||"null");if(sv){vid=sv.vid||"";$("vurl").value=sv.url||"";$("sub").value=sv.sub||"";if($("sub").value.trim()){cues=parseSub($("sub").value);renderTr()}}}catch(e){}
})();
</script>
</body>
</html>
